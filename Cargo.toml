[package]
name = "agamenon"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework & async
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "macros", "migrate"] }

# S3 Storage
aws-sdk-s3 = "1.0"
aws-config = "1.0"

# Avro/Schema validation
apache-avro = "0.16"

# Caching
moka = { version = "0.12", features = ["future"] }

# Auth & utilities
base64 = "0.21"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"

# Testing
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
